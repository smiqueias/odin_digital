name: gtb_teatro
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.0
  flutter: ^3.38.6

dependencies:
  flutter:
    sdk: flutter

  gap: ^3.0.1
  intersperse: ^2.0.0
  shimmer: ^3.0.0
  prototype_constrained_box: 2.0.3
  clock: 1.1.2
  modal_bottom_sheet: 3.0.0
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  gtb_analysis_options:
    git:
      url: https://github.com/smiqueias/gtb_digital
      ref: dev
      path: modules/gtb_analysis_options

flutter:
  fonts:
    - family: BtgPactualSans
      fonts:
        - asset: lib/assets/fonts/btg_pactual_sans_regular.ttf
          style: normal
          weight: 400
        - asset: lib/assets/fonts/btg_pactual_sans_italic.ttf
          style: italic
          weight: 400
        - asset: lib/assets/fonts/btg_pactual_sans_bold_italic.ttf
          style: italic
          weight: 700
        - asset: lib/assets/fonts/btg_pactual_sans_bold.ttf
          style: normal
          weight: 700
    - family: OrquestraIcons
      fonts:
        - asset: lib/assets/fonts/orquestra_icons.ttf